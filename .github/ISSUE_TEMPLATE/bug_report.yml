name: "🐞 Bug Report / 问题反馈"
description: Crashes, connection failures, query errors, display bugs, or other reproducible issues. / 程序崩溃、连接失败、查询异常、界面显示错误或其他可复现问题。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。涉及敏感信息请脱敏。请尽量提供数据库类型、版本、复现步骤、截图和错误日志。
        Thanks for reporting this. Redact sensitive information and include the database type/version, reproduction steps, screenshots, and logs when possible.
        DBX 版本、运行环境、操作系统和系统架构可在应用内通过“设置 → 关于我们 → 复制支持信息”一键复制。
        You can copy the DBX version, runtime, operating system, and architecture in the app via “Settings → About → Copy support information”.
  - type: input
    id: database
    attributes:
      label: 数据库类型和版本 / Database type and version
      description: 例如 PostgreSQL 16、MySQL 8.0、Redis 7.2。 / For example, PostgreSQL 16, MySQL 8.0, or Redis 7.2.
      placeholder: "例如：PostgreSQL 16.2 / Example: PostgreSQL 16.2"
    validations: {required: true}
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Problem description
      description: 请按下面的清单逐项填写。 / Complete each item below.
      placeholder: |
        1. 复现步骤 / Steps: 新建连接 → 填写信息 → 点击保存 / Create connection → enter details → click Save
        2. 期望结果 / Expected: 能正常展开 schema / Schema expands normally
        3. 实际结果 / Actual: 一直 loading，无错误提示 / Loading never finishes
        4. 附上截图和错误日志 / Attach screenshots and logs when possible
    validations: {required: true}
  - type: textarea
    id: support-info
    attributes:
      label: 支持信息 / Support information
      description: 粘贴“复制支持信息”的结果；如无法打开应用，请说明原因。 / Paste the copied support information; explain if the app cannot open.
      placeholder: |
        DBX 版本 / Version: v0.5.52
        运行环境 / Runtime: Desktop
        操作系统 / OS: macOS 26.4
        系统架构 / Architecture: aarch64
    validations: {required: true}
  - type: dropdown
    id: priority
    attributes:
      label: 优先级（是否紧急） / Priority (urgency)
      description: 紧急 = 希望下个版本优先修；维护者可调整。 / Urgent means you hope for the next release; maintainers may adjust it.
      options:
        - "🔴 P0 紧急 · 下个版本必须修 / Urgent · Must fix next release"
        - "🟠 P1 重要 · 尽快处理 / Important · Fix soon"
        - "🟡 P2 普通 · 按排期处理 / Normal · Schedule as appropriate"
        - "🟢 P3 低优 · 有空再修 / Low · Fix when possible"
    validations: {required: true}
  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional information
      description: 截图、SQL 样例、连接方式、特殊环境等。 / Screenshots, SQL samples, connection method, or special environments.
