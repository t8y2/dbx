name: Deploy Docs

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_run:
    # Release and agent metadata are embedded during the static build, so wait for their R2 producers.
    workflows: ["Sync Changelog to R2", "Agents Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 文档站部署到上游的 Cloudflare Workers，需要上游的 R2 凭据；
    # fork 没有这些凭据，每次同步带进 docs/** 改动都会失败一次。
    # 部署目标固定是上游的站点，fork 不该跑它（同 contributors.yml）。
    # 仓库守卫与 workflow_run 的结论判断必须合并在同一行：job 级 if: 只有一行，
    # 写两行会让后一行覆盖前一行。
    if: github.repository == 't8y2/dbx' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - run: cd docs && pnpm install --frozen-lockfile && pnpm build
      - name: Deploy to Cloudflare Workers
        working-directory: docs
        run: pnpm dlx wrangler@4 deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
