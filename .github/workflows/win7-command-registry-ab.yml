name: Win7 command registry A/B

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/win7-command-registry-ab.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      RUSTFLAGS: -C debuginfo=line-tables-only -C target-feature=+crt-static
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: ${{ secrets.SCCACHE_S3_BUCKET == '' && 'true' || 'false' }}
      SCCACHE_GHA_VERSION: win7-webview2-1.0.902.49-v1
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust for Windows 7
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-22
          components: rust-src

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Configure S3 sccache
        if: env.SCCACHE_GHA_ENABLED != 'true'
        shell: bash
        env:
          CACHE_BUCKET: ${{ secrets.SCCACHE_S3_BUCKET }}
          CACHE_ENDPOINT: ${{ secrets.SCCACHE_S3_ENDPOINT }}
          CACHE_REGION: ${{ secrets.SCCACHE_S3_REGION }}
          CACHE_KEY_PREFIX: ${{ secrets.SCCACHE_S3_KEY_PREFIX }}
          CACHE_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
          CACHE_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}
        run: |
          {
            echo "SCCACHE_BUCKET=${CACHE_BUCKET}"
            echo "SCCACHE_ENDPOINT=${CACHE_ENDPOINT}"
            echo "SCCACHE_REGION=${CACHE_REGION}"
            echo "SCCACHE_S3_KEY_PREFIX=${CACHE_KEY_PREFIX}"
            echo "SCCACHE_S3_USE_SSL=true"
            echo "AWS_ACCESS_KEY_ID=${CACHE_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${CACHE_SECRET_ACCESS_KEY}"
          } >> "$GITHUB_ENV"

      - name: Prepare Win7-compatible WebView2 loader
        shell: pwsh
        run: ./.github/scripts/prepare-webview2-win7-loader.ps1

      - name: Prepare WebView2 109 fixed runtime
        shell: pwsh
        run: ./.github/scripts/prepare-webview2-win7-runtime.ps1

      - name: Build frontend
        run: pnpm build

      - name: Warm Rust dependencies
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.webview2-win7-fixed.conf.json -Raw
          cargo -Z host-config -Z target-applies-to-host -Z build-std=std,panic_abort `
            --config .github/fixtures/win7-host-repro-config.toml `
            build --locked --package dbx --lib --release --features custom-protocol `
            --target x86_64-win7-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare full and half command registries
        shell: pwsh
        run: |
          $env:RUSTC_WRAPPER = ""
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.webview2-win7-fixed.conf.json -Raw
          $resultRoot = Join-Path $env:RUNNER_TEMP "dbx-registry-ab"
          $sourcePath = "src-tauri/src/lib.rs"
          New-Item -ItemType Directory -Force -Path $resultRoot | Out-Null
          $results = @{}

          function Measure-Registry([string] $name, [int] $commandCount) {
            $outputDir = Join-Path $resultRoot $name
            New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
            cargo clean --package dbx --release --target x86_64-win7-windows-msvc
            if ($LASTEXITCODE -ne 0) { throw "Could not clean dbx before $name." }
            $timer = [System.Diagnostics.Stopwatch]::StartNew()
            cargo -Z host-config -Z target-applies-to-host -Z build-std=std,panic_abort `
              --config .github/fixtures/win7-host-repro-config.toml `
              rustc --locked --package dbx --lib --release --features custom-protocol `
              --target x86_64-win7-windows-msvc --timings `
              -- "-Zdump-mono-stats=$outputDir" "-Zdump-mono-stats-format=json"
            $exitCode = $LASTEXITCODE
            $timer.Stop()
            if ($exitCode -ne 0) { throw "$name compile failed with exit code $exitCode." }

            $monoFile = Get-ChildItem -LiteralPath $outputDir -File -Filter "*.mono_items.json" |
              Select-Object -First 1
            if (!$monoFile) { throw "$name compile did not write mono statistics." }
            $monoItems = Get-Content -LiteralPath $monoFile.FullName -Raw | ConvertFrom-Json
            $results[$name] = @{
              commands = $commandCount
              definitions = $monoItems.Count
              estimate = ($monoItems | Measure-Object -Property total_estimate -Sum).Sum
              seconds = [math]::Round($timer.Elapsed.TotalSeconds, 2)
            }
            $monoItems = $null
            "${name}: $($results[$name].seconds) seconds" | Write-Host
          }

          $sourceLines = Get-Content -LiteralPath $sourcePath
          $insideHandler = $false
          $startCount = 0
          $endCount = 0
          $fullCount = 0
          $halfCount = 0
          $reducedLines = foreach ($line in $sourceLines) {
            if ($line -match 'tauri::generate_handler!\[') {
              $insideHandler = $true
              $startCount++
            } elseif ($insideHandler -and $line -match '^\s*\]\)\)') {
              $insideHandler = $false
              $endCount++
            } elseif ($insideHandler -and $line -match '^(\s+)commands::') {
              $fullCount++
              if ($fullCount % 2 -eq 0) {
                "$($Matches[1])#[cfg(any())]"
              } else {
                $halfCount++
              }
            }
            $line
          }
          if ($startCount -ne 1 -or $endCount -ne 1 -or $fullCount -lt 2 -or
              $halfCount -ne [math]::Ceiling($fullCount / 2)) {
            throw "Could not identify the command registry."
          }

          try {
            Measure-Registry "full" $fullCount
            $reducedLines | Set-Content -LiteralPath $sourcePath -Encoding utf8NoBOM
            Measure-Registry "half" $halfCount
          } finally {
            git restore --source=HEAD -- $sourcePath
            if ($LASTEXITCODE -ne 0) { throw "Could not restore src-tauri/src/lib.rs." }
          }

          $results | ConvertTo-Json -Depth 3 |
            Set-Content -LiteralPath (Join-Path $resultRoot "summary.json") -Encoding utf8NoBOM
          @(
            "### Win7 dbx_lib command registry A/B"
            ""
            "| Registry | Commands | Mono items | Estimated cost | Seconds |"
            "| --- | ---: | ---: | ---: | ---: |"
            "| Full | $($results['full'].commands) | $($results['full'].definitions) | $($results['full'].estimate) | $($results['full'].seconds) |"
            "| Half | $($results['half'].commands) | $($results['half'].definitions) | $($results['half'].estimate) | $($results['half'].seconds) |"
            ""
            "Both runs use the Win7 CI release profile and disable sccache."
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload command registry A/B results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DBX-win7-command-registry-ab
          path: |
            ${{ runner.temp }}/dbx-registry-ab/
            target/cargo-timings/
          if-no-files-found: warn
          retention-days: 3
