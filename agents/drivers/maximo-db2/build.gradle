dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':db2')
    implementation 'com.ibm.db2:jcc:11.5.9.0'
}

tasks.named('shadowJar') {
    manifest {
        attributes('Agent-Label': 'IBM Maximo (DB2)', 'Main-Class': 'com.dbx.agent.maximodb2.MaximoAgent')
    }
}
