<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><!-- Basic adaptation of ../gbase.png: inverse-luminance mask preserves transparent background and removes white panels / details. -->
<defs><filter id="gbase-invert" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="table" tableValues="1 0"/><feFuncG type="table" tableValues="1 0"/><feFuncB type="table" tableValues="1 0"/></feComponentTransfer></filter><mask id="gbase-mono" x="0" y="0" width="128" height="128" maskUnits="userSpaceOnUse" mask-type="luminance"><image width="128" height="128" href="data:image/png;base64," filter="url(#gbase-invert)"/></mask></defs><rect width="128" height="128" fill="white" mask="url(#gbase-mono)"/></svg>
