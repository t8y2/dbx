[package]
name = "dbx-ai-provider"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
dbx-platform = { path = "../dbx-platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
bytes = "1"
httpdate = "1"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
