[package]
name = "dbx-cli"
version = "0.4.105"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "dbx"
path = "src/main.rs"

[dependencies]
dbx-core = { path = "../dbx-core", default-features = false, features = ["sqlite-bundled"] }
dbx-mcp = { path = "../dbx-mcp" }
dirs = "6"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }

[dev-dependencies]
dbx-core = { path = "../dbx-core", default-features = false, features = ["test-support"] }
async-trait = "0.1"
