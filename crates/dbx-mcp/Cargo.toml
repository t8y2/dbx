[package]
name = "dbx-mcp"
version = "0.4.99"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["duckdb-sidecar", "mq-admin", "sqlite-bundled"]
duckdb-sidecar = ["dbx-core/duckdb-sidecar"]
mq-admin = ["dbx-core/mq-admin"]
# `--no-default-features` runs (skip DuckDB) must re-add this via
# `--features sqlite-bundled`, otherwise tests/bins link the system SQLite.
sqlite-bundled = ["dbx-core/sqlite-bundled"]
# Native macOS/Windows builds enable this so CLI/MCP can read the OS
# keychain key Desktop provisioned during the data security upgrade; the
# Linux zigbuild legs cannot link the dbus Secret Service backend and keep
# falling back to the managed .dbx/secret.key file.
os-keyring = ["dbx-core/os-keyring"]
transaction-test-hooks = []

[[bin]]
name = "dbx-mcp"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
csv = "1"
dbx-core = { path = "../dbx-core", default-features = false }
dirs = "6"
log = "0.4"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls", "client_ed25519", "chrono", "rust_decimal"] }
axum = "0.8"
chrono = "0.4"
rmcp = { version = "2.2.0", features = ["client", "transport-io", "transport-streamable-http-server"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.32", features = ["system"] }
sqlparser = { version = "0.62", features = ["visitor"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rmcp = { version = "2.2.0", features = ["transport-streamable-http-client-reqwest"] }
rustls-pemfile = "2.2"
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util"] }
tokio-rustls = "0.26"
