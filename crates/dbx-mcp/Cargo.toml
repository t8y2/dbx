[package]
name = "dbx-mcp"
version = "0.4.75"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["duckdb-sidecar", "mq-admin"]
duckdb-sidecar = ["dbx-core/duckdb-sidecar"]
mq-admin = ["dbx-core/mq-admin"]

[[bin]]
name = "dbx-mcp"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
dbx-core = { path = "../dbx-core", default-features = false, features = ["sqlite-bundled"] }
dirs = "6"
rmcp = { version = "2.2.0", features = ["client", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
rustls-pemfile = "2.2"
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util"] }
tokio-rustls = "0.26"
