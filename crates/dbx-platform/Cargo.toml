[package]
name = "dbx-platform"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = []
host-prompts = ["dep:serde", "dep:uuid", "tokio/sync"]
test-support = ["host-prompts"]
downloads = ["dep:reqwest", "dep:futures", "dep:serde"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"], optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = ["process"] }
serde = { version = "1.0", features = ["derive"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[target.'cfg(all(unix, not(target_os = "redox")))'.dependencies]
nix = { version = "0.31.3", features = ["user"] }
