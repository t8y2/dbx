[package]
name = "dbx-sqlite-worker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Short-lived SQLite worker process for remote file-host access over SSH"
publish = false

[[bin]]
name = "dbx-sqlite-worker"
path = "src/main.rs"

[features]
default = ["runtime"]
runtime = ["dep:rusqlite"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
rusqlite = { version = "0.32", optional = true, features = ["bundled", "backup"] }

[dev-dependencies]
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
