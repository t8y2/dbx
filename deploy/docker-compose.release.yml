services:
  dbx:
    image: t8y2/dbx:latest
    # For faster pulls in China, use the CNB image instead:
    # image: docker.cnb.cool/dbxio.com/dbx:latest
    pull_policy: always
    ports:
      - "4224:4224"
    volumes:
      - dbx-data:/app/data
    # environment:
    #   DBX_SECRET_KEY_FILE: /run/secrets/dbx_secret_key
    # secrets:
    #   - dbx_secret_key
    restart: unless-stopped

volumes:
  dbx-data:

# secrets:
#   dbx_secret_key:
#     file: ./dbx_secret_key
