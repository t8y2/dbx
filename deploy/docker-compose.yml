services:
  dbx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "4224:4224"
    environment:
      - DBX_PASSWORD=changeme
      - DBX_BACKUP_ROOT=/app/backups
      # Native Streamable HTTP MCP is served by this same Web listener at /mcp.
      # Set the host authority clients use (including its externally mapped port).
      # - DBX_WEB_MCP_TOKEN=replace-with-a-long-random-secret
      # - DBX_WEB_MCP_ALLOWED_HOSTS=localhost:4224
      # Browser-based MCP clients additionally need their exact Origin, for example:
      # - DBX_WEB_MCP_ALLOWED_ORIGINS=https://mcp-client.example.com
      # Uncomment when publishing DBX under a reverse-proxy subpath, e.g. https://example.com/dbx/
      # - DBX_PUBLIC_BASE_PATH=/dbx
      # Optional production override. The default key is /app/data/.dbx/secret.key.
      # - DBX_SECRET_KEY_FILE=/run/secrets/dbx_secret_key
      # --- OIDC / SSO Configuration ---
      # - DBX_PUBLIC_URL=https://dbx.example.com
      # - DBX_OIDC_ISSUER=https://auth.example.com/realms/master
      # - DBX_OIDC_CLIENT_ID=dbx-client
      # - DBX_OIDC_CLIENT_SECRET=replace-with-client-secret
      # - DBX_OIDC_BUTTON_LABEL=Sign in with SSO
      # - DBX_OIDC_DISABLE_PASSWORD=false
      # - DBX_OIDC_ALLOWED_DOMAINS=example.com,company.vn
      # CEL Admission Expression (Google CEL spec - https://github.com/google/cel-spec):
      # Evaluated against the `claims` object (merged id_token + userinfo).
      # Returns:
      #   - bool: true = admitted as "Admin", false = rejected
      #   - string: non-empty string = admitted with that role, "" = rejected
      # Examples:
      #   - Boolean check: "admin" in claims.groups
      #   - Email verified check: claims.email_verified == true
      #   - Role mapping: "db-admins" in claims.groups ? "Admin" : "db-devs" in claims.groups ? "Developer" : ""
      # - DBX_OIDC_ADMISSION_EXPR="admin" in claims.groups
    # secrets:
    #   - dbx_secret_key
    volumes:
      - dbx-data:/app/data
      - dbx-backups:/app/backups
    stop_grace_period: 90s
    restart: unless-stopped

volumes:
  dbx-data:
  dbx-backups:

# secrets:
#   dbx_secret_key:
#     file: ./dbx_secret_key
