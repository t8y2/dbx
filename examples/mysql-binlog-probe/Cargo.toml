[package]
name = "dbx-mysql-binlog-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Technical verification only; do not enable binlog in shipping driver builds yet.
[workspace]

[dependencies]
dbx-binlog = { path = "../../crates/dbx-binlog", features = ["process-host"] }
mysql_common = { git = "https://github.com/t8y2/rust_mysql_common.git", rev = "47740d85a8277167a5717afac785d37b46a36296", default-features = false, features = ["binlog"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
serde_json = "1"
