<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{PLUGIN_NAME_HTML}}</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at top left, rgba(109,93,252,.2), transparent 40%), Canvas; color: CanvasText; }
      main { width: min(680px, 100%); padding: 32px; border: 1px solid color-mix(in srgb, CanvasText 16%, transparent); border-radius: 20px; background: color-mix(in srgb, Canvas 92%, transparent); box-shadow: 0 24px 80px rgba(0,0,0,.12); }
      .eyebrow { color: #6d5dfc; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 10px 0; font-size: clamp(28px, 5vw, 46px); }
      p { line-height: 1.65; opacity: .74; }
      button { margin-top: 20px; border: 0; border-radius: 12px; padding: 12px 18px; background: #6d5dfc; color: white; font: inherit; font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      pre { margin-top: 20px; min-height: 92px; overflow: auto; padding: 16px; border-radius: 12px; background: color-mix(in srgb, CanvasText 7%, transparent); }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow" id="eyebrow">DBX plugin workbench</div>
      <h1>{{PLUGIN_NAME_HTML}}</h1>
      <p id="description">This sandboxed page talks to the {{LANGUAGE_LABEL}} sidecar only through the DBX Host Bridge.</p>
      <button id="ping" type="button">Invoke sidecar</button>
      <pre id="result">Waiting for DBX plugin host…</pre>
    </main>
    <script>
      const result = document.querySelector("#result");
      const button = document.querySelector("#ping");
      const copy = {
        en: { eyebrow: "DBX plugin workbench", description: "This sandboxed page talks to the {{LANGUAGE_LABEL}} sidecar only through the DBX Host Bridge.", button: "Invoke sidecar", ready: "Ready", calling: "Calling sidecar…", error: "Error" },
        zh: { eyebrow: "DBX 插件工作台", description: "此沙箱页面仅通过 DBX Host Bridge 与 {{LANGUAGE_LABEL}} Sidecar 通信。", button: "调用 Sidecar", ready: "已就绪", calling: "正在调用 Sidecar…", error: "错误" }
      };
      let text = copy.en;
      window.dbxPlugin.ready.then(() => {
        text = window.dbxPlugin.locale.toLowerCase().startsWith("zh") ? copy.zh : copy.en;
        document.querySelector("#eyebrow").textContent = text.eyebrow;
        document.querySelector("#description").textContent = text.description;
        button.textContent = text.button;
        result.textContent = text.ready;
      });
      button.addEventListener("click", async () => {
        button.disabled = true;
        result.textContent = text.calling;
        try {
          result.textContent = JSON.stringify(await window.dbxPlugin.invoke("{{METHOD_PREFIX}}/ping", { connectionId: window.dbxPlugin.context?.connectionId }), null, 2);
        } catch (error) {
          result.textContent = `${text.error}: ${error.message}`;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
