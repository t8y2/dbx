[package]
name = "dbx-plugin-packager"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Build .dbxp archives for DBX plugins"
autobins = false

[workspace]

[lib]
name = "dbx_plugin_packager"
path = "src/main.rs"

[[bin]]
name = "dbx-plugin-packager"
path = "src/bin/dbx-plugin-packager.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
