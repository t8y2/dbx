<main><h1>#11513 界面预览</h1><p class="m">commit 60696b1 · <a href="https://github.com/t8y2/dbx/pull/11513">回到 PR</a> · 这个 PR 给 PostgreSQL 用户自定义类型增加了可视化管理能力：在对象浏览器里可新建、编辑、删除类型，并支持草稿、预览 SQL、删除确认和会话保留。它还把对象面板的缓存改成可保留未完成修改的 KeepAlive，避免切换标签时丢失编辑状态。</p>
