<main><h1>#11541 界面预览</h1><p class="m">commit 8465ee3 · <a href="https://github.com/t8y2/dbx/pull/11541">回到 PR</a> · 这个 PR 给 OceanBase Oracle 的对象重命名加了更严格的受控流程：视图重命名现在会先校验当前 schema、再回读新旧名称状态；过程/函数重命名改为五步计划，失败时保留原定义快照并阻止继续编辑。界面上还新增了重命名警告、失败提示和“重命名后源码快照只读”的状态文案。</p>
