<main><h1>#11547 界面预览</h1><p class="m">commit 671bb49 · <a href="https://github.com/t8y2/dbx/pull/11547">回到 PR</a> · 在 Oracle / OceanBase Oracle 的表结构页里新增了“编辑主键”内联编辑器，可按列顺序调整或清空主键，并在预览后展示受影响对象、DDL、执行结果和恢复 SQL。后端同时接入了主键预览/执行接口，支持 OceanBase 的 MODIFY PRIMARY KEY 路径及 Oracle 的替换流程与失败读回。</p>
