<main><h1>#11549 界面预览</h1><p class="m">commit d803006 · <a href="https://github.com/t8y2/dbx/pull/11549">回到 PR</a> · 这个 PR 在 Oracle / OceanBase Oracle 的表结构编辑里新增了三类约束编辑器：主键、外键和 CHECK。它们都支持先预览 DDL，再执行并读回实际状态，执行结果里会显示部分成功、恢复 SQL 和实际约束状态；同时 OceanBase 版会隐藏 Oracle 专属的延迟选项和主键旧索引处理。</p>
<p class="warn">⚠️ 这次录制有 17 步没能按计划执行；带 ⚠️ 的截图拍摄于步骤失败之后，画面未必是说明文字所描述的状态。</p>
