<main><h1>#11550 界面预览</h1><p class="m">commit 8bdbd16 · <a href="https://github.com/t8y2/dbx/pull/11550">回到 PR</a> · 这个 PR 在 Oracle / OceanBase Oracle 的表结构编辑里新增了 UNIQUE、外键和主键的专用编辑器，支持先预览 DDL、再确认执行，并在结果区回读当前约束、受影响对象和恢复 SQL。它还区分 Oracle 与 OceanBase 的行为差异，例如 OceanBase 隐藏部分状态选项、主键和 UNIQUE 的支持索引处理不同。</p>
