<main><h1>#11568 界面预览</h1><p class="m">commit 4f120d1 · <a href="https://github.com/t8y2/dbx/pull/11568">回到 PR</a> · 本 PR 为 Oracle / OceanBase Oracle 的触发器新增了完整定义编辑入口，支持在结构化字段与完整源码之间切换、预览完整 DDL、保存后保留恢复材料，并在表结构页/对象浏览中把触发器按真实所有者显示出来。另在 OceanBase Oracle 的对象列表中加入了分页加载与分页搜索提示，且禁用了不适用的正则搜索与部分排序操作。</p>
