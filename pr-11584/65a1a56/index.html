<main><h1>#11584 界面预览</h1><p class="m">commit 65a1a56 · <a href="https://github.com/t8y2/dbx/pull/11584">回到 PR</a> · 这个 PR 修复了结构编辑器里在“字段/列”与其他结构页签之间切换后，横向滚动条会丢失、并且列区横向滚动位置无法恢复的问题。它还在列虚拟列表更新时主动刷新横向滚动条状态，以保证页签切回后界面能继续正确显示滚动条。</p>
